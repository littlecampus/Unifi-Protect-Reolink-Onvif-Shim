name: external-proxy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.27'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check external_proxy.py container_health.py tests
      - run: uv run ruff format --check external_proxy.py container_health.py tests
      - run: uv run python external_proxy.py --config config.example.json --validate
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.27'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: docker build --tag external-onvif-proxy:test .
      - run: uv run python -m tests.container_smoke
        env:
          TMPDIR: ${{ runner.temp }}
      - run: PROXY_BIND_IP=192.0.2.100 docker compose -f compose.example.yaml config --quiet
